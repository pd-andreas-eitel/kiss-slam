[project]
name = "kiss-slam-build"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "13.0"
libc = { family="glibc", version="2.31" }

[dependencies]
python = "3.11.*"
pip = "*"
cmake = ">=3.22"
scikit-build-core = "*"
pybind11 = "*"
twine = "*"
pytorch-gpu = "==2.9.1"
cuda-version = ">=12.9.0"
cuda-toolkit = ">=12.9"